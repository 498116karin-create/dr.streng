<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mystic Arts · Doctor Strange</title>
<style>
  :root { --amber:#ffa032; --ink:#070402; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--ink); color:var(--amber); font-family:system-ui, "Noto Sans Thai", sans-serif; overflow:hidden; }
  video, canvas { position:fixed; inset:0; width:100%; height:100%; }
  video { object-fit:cover; transform:scaleX(-1); filter:saturate(.5) brightness(.5) sepia(.4); }
  #fx { pointer-events:none; }
  #hud { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  #pw { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font:inherit; font-size:13px; padding:7px 12px; border:1px solid rgba(255,160,50,.45); border-radius:999px; color:var(--amber); background:rgba(7,4,2,.6); pointer-events:auto; font-variant-numeric:tabular-nums; }
  .chip.on { background:var(--amber); color:var(--ink); border-color:var(--amber); }
  #fps { pointer-events:none; white-space:nowrap; }
  #status { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); text-align:center; font-size:16px; padding:0 16px; text-shadow:0 0 10px #000; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; background:var(--ink); z-index:5; text-align:center; padding:24px; }
  #start h1 { font-size:28px; font-weight:600; }
  #start p { max-width:34ch; line-height:1.7; opacity:.85; }
  #go { font:inherit; font-size:18px; color:var(--ink); background:var(--amber); border:0; padding:14px 32px; border-radius:12px; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="fx"></canvas>
<div id="hud"><div id="pw"></div><div class="chip" id="fps">-- fps</div></div>
<div id="status">กำมือเพื่อร่ายเวท</div>
<div id="start">
  <h1>Mystic Arts</h1>
  <p>ชู 1–4 นิ้ว (พับนิ้วโป้ง) ค้างไว้ครึ่งวินาทีเพื่อเลือกเวท แล้วกำมือเพื่อร่าย แบมือเพื่อหยุด<br>1 Eldritch · 2 Sling Ring · 3 Mirror Dimension · 4 Eye of Agamotto</p>
  <button id="go">เปิดกล้อง</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const video = document.getElementById('v'), cv = document.getElementById('fx'), ctx = cv.getContext('2d');
const statusEl = document.getElementById('status'), fpsEl = document.getElementById('fps');
let W = 0, H = 0;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();

const POW = [
  { n: 'Eldritch Magic', k: '1 Eldritch' },
  { n: 'Sling Ring Portal', k: '2 Portal' },
  { n: 'Mirror Dimension', k: '3 Mirror' },
  { n: 'Eye of Agamotto', k: '4 Time' }
];
let sel = 0;
const pw = document.getElementById('pw');
POW.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = p.k;
  b.onclick = () => { sel = i; chips(); }; pw.appendChild(b);
});
function chips() { [...pw.children].forEach((b, i) => b.classList.toggle('on', i === sel)); }
chips();

const C = '255,150,40', HOT = '255,225,160', G = '110,255,170', GH = '215,255,230';
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const ease = o => 1 - Math.pow(1 - o, 3);

function toScreen(p) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W / vw, H / vh);
  return { x: (1 - p.x) * vw * s - (vw * s - W) / 2, y: p.y * vh * s - (vh * s - H) / 2 };
}
function analyze(lm) {
  const tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
  const count = tips.filter((t, i) => dist(lm[t], lm[0]) > dist(lm[pips[i]], lm[0]) * 1.12).length;
  const thumb = dist(lm[4], lm[17]) > dist(lm[3], lm[17]) * 1.15;
  const ids = [0, 5, 9, 13, 17];
  const c = toScreen({ x: ids.reduce((s, i) => s + lm[i].x, 0) / 5, y: ids.reduce((s, i) => s + lm[i].y, 0) / 5 });
  return { fist: count === 0, count, thumb, c, size: dist(toScreen(lm[0]), toScreen(lm[9])) };
}

const slots = [0, 1].map(() => ({ x: 0, y: 0, size: 0, tx: 0, ty: 0, tsize: 0, open: 0, seen: -1e9, lastFist: -1e9, trail: [] }));
let detectCount = 0, hold = { n: 0, t: 0 };

const handsModel = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
handsModel.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
handsModel.onResults(r => {
  detectCount++;
  const now = performance.now();
  const hs = (r.multiHandLandmarks || []).slice(0, 2).map(analyze);
  hs.forEach((h, i) => {
    const s = slots[i];
    if (now - s.seen > 400) { s.x = h.c.x; s.y = h.c.y; s.size = h.size; }
    s.tx = h.c.x; s.ty = h.c.y; s.tsize = h.size; s.seen = now;
    if (h.fist) s.lastFist = now;
  });
  // choose power: 1-4 fingers, thumb tucked, held ~0.45s (open palm / fist never switch)
  const h0 = hs.find(h => !h.fist && !h.thumb && h.count >= 1 && h.count <= 4);
  if (h0) {
    if (hold.n !== h0.count) hold = { n: h0.count, t: now };
    else if (now - hold.t > 450 && sel !== h0.count - 1) { sel = h0.count - 1; chips(); }
  } else hold = { n: 0, t: now };
});

// ---------- drawing helpers ----------
function glowStroke(wide, thin, c = C, h = HOT) {
  ctx.strokeStyle = `rgba(${c},.2)`; ctx.lineWidth = wide; ctx.stroke();
  ctx.strokeStyle = `rgba(${h},.95)`; ctx.lineWidth = thin; ctx.stroke();
}
function circle(r) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); }
function polygon(n, r, step) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i * step / n) * Math.PI * 2 - Math.PI / 2;
    i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
}
function drawCover() { // camera frame, mirrored, same crop as the <video>
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const k = Math.max(W / vw, H / vh), dw = vw * k, dh = vh * k;
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh); ctx.restore();
}
function glow(x, y, r, c, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

let sparks = [];
function spark(x, y, vx, vy, decay, g, grav) { if (sparks.length < 500) sparks.push({ x, y, px: x, py: y, vx, vy, life: 1, decay, g, grav }); }
function ringSparks(s, R, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, r = R * (.88 + Math.random() * .12), sp = 2 + Math.random() * 5, out = 1 + Math.random() * 3;
    spark(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, -Math.sin(a) * sp + Math.cos(a) * out, Math.cos(a) * sp + Math.sin(a) * out - 1, .015 + Math.random() * .02, false, .1);
  }
}
function timeSparks(s, R, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, r = R * (1 + Math.random() * .35);
    spark(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, -Math.cos(a) * 1.6 + Math.sin(a) * 1.3, -Math.sin(a) * 1.6 - Math.cos(a) * 1.3, .02, true, 0);
  }
}

// ---------- 1. Eldritch Magic: mandala shield + energy daggers + energy whip ----------
function drawMandala(s, t, R, a) {
  if (R < 2) return;
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalAlpha = Math.min(1, a * 1.4);
  glow(0, 0, R * 1.25, C, .3);
  circle(R); glowStroke(8, 2.2);
  ctx.save(); ctx.setLineDash([R * .07, R * .035]); ctx.lineDashOffset = -t * R * .25; circle(R * .93); glowStroke(4, 1.3); ctx.restore();
  ctx.save(); ctx.rotate(-t * .5); ctx.beginPath();
  for (let i = 0; i < 36; i++) { const an = i / 36 * 6.283, r1 = R * (i % 3 ? .85 : .88); ctx.moveTo(Math.cos(an) * R * .8, Math.sin(an) * R * .8); ctx.lineTo(Math.cos(an) * r1, Math.sin(an) * r1); }
  glowStroke(3, 1); ctx.restore();
  circle(R * .78); glowStroke(3, 1.2);
  ctx.save(); ctx.rotate(t * .35);
  for (let i = 0; i < 12; i++) {
    ctx.save(); ctx.rotate(i / 12 * 6.283); ctx.beginPath();
    ctx.moveTo(R * .64, 0); ctx.lineTo(R * .74, 0);
    ctx.moveTo(R * .69, -R * .035); ctx.lineTo(R * .72, 0); ctx.lineTo(R * .69, R * .035); ctx.lineTo(R * .66, 0); ctx.closePath();
    glowStroke(3, 1.2); ctx.restore();
  }
  ctx.restore();
  circle(R * .62); glowStroke(3, 1.2);
  ctx.save(); ctx.rotate(t * .6); polygon(4, R * .55, 1); glowStroke(3, 1.4); ctx.restore();
  ctx.save(); ctx.rotate(-t * .6 + Math.PI / 4); polygon(4, R * .55, 1); glowStroke(3, 1.4); ctx.restore();
  circle(R * .4); glowStroke(3, 1.2);
  ctx.save(); ctx.rotate(t * .9); polygon(8, R * .4, 3); glowStroke(3, 1.4); ctx.restore();
  glow(0, 0, R * .18, HOT, .95);
  ctx.restore();
}
function drawWeapons(s, t, R, e) {
  // energy whip following the hand
  const tr = s.trail;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < tr.length; i++) {
    const k = i / tr.length;
    ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y);
    ctx.strokeStyle = `rgba(${C},${.3 * k})`; ctx.lineWidth = s.size * .5 * k; ctx.stroke();
    ctx.strokeStyle = `rgba(${HOT},${.9 * k})`; ctx.lineWidth = s.size * .1 * k + 1; ctx.stroke();
  }
  // orbiting energy daggers
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(t * 2 + i * Math.PI / 2); ctx.translate(R * 1.25, 0);
    const L = R * .45 * e, w = R * .07 * e;
    ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(0, -w); ctx.lineTo(-L * .3, 0); ctx.lineTo(0, w); ctx.closePath();
    ctx.fillStyle = `rgba(${C},.35)`; ctx.fill(); glowStroke(5, 1.4); ctx.restore();
  }
}

// ---------- 2. Sling Ring portal ----------
function drawPortal(s, t, e, R) {
  if (R < 4) return;
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.arc(0, 0, R * .93, 0, 6.283); ctx.clip();
  ctx.save(); ctx.rotate(Math.PI + t * .05); ctx.scale(1.7, 1.7); ctx.translate(-W / 2, -H / 2); drawCover(); ctx.restore();
  const g = ctx.createRadialGradient(0, 0, R * .3, 0, 0, R * .93);
  g.addColorStop(0, 'rgba(25,8,45,.25)'); g.addColorStop(1, `rgba(${C},.5)`);
  ctx.fillStyle = g; ctx.fillRect(-R, -R, 2 * R, 2 * R);
  ctx.restore();
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalAlpha = Math.min(1, e * 1.4);
  glow(0, 0, R * 1.3, C, .25);
  circle(R); glowStroke(16, 4);
  ctx.save(); ctx.setLineDash([R * .5, R * .12]); ctx.lineDashOffset = -t * R * .8; circle(R * .96); glowStroke(7, 2); ctx.restore();
  ctx.save(); ctx.setLineDash([R * .15, R * .1]); ctx.lineDashOffset = t * R * .5; circle(R * 1.06); glowStroke(4, 1.3); ctx.restore();
  ctx.restore();
}

// ---------- 3. Mirror Dimension: kaleidoscope warp of reality ----------
function drawMirror(s, t, e) {
  const R = Math.hypot(W, H) * .8 * e; if (R < 4) return;
  const N = 8, st = Math.PI * 2 / N;
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = Math.min(1, e * 1.5);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.clip();
  ctx.rotate(t * .22);
  for (let i = 0; i < N; i++) {
    ctx.save(); ctx.rotate(i * st);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R + 2, 0, st + .01); ctx.closePath(); ctx.clip();
    if (i % 2) { ctx.rotate(st); ctx.scale(1, -1); }
    ctx.translate(-s.x, -s.y); drawCover(); ctx.restore();
  }
  ctx.fillStyle = `rgba(${C},.12)`; ctx.fillRect(-R, -R, 2 * R, 2 * R);
  ctx.restore();
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(t * .22); ctx.beginPath();
  for (let i = 0; i < N; i++) { ctx.moveTo(0, 0); ctx.lineTo(Math.cos(i * st) * R, Math.sin(i * st) * R); }
  glowStroke(6, 1.5); circle(R); glowStroke(14, 3); ctx.restore();
}

// ---------- 4. Eye of Agamotto: time ----------
function drawTime(s, t, R, e) {
  if (R < 2) return;
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalAlpha = Math.min(1, e * 1.4);
  glow(0, 0, R * 1.3, G, .28);
  circle(R); glowStroke(8, 2.2, G, GH);
  ctx.save(); ctx.setLineDash([R * .06, R * .04]); ctx.lineDashOffset = t * R * .3; circle(R * .9); glowStroke(4, 1.2, G, GH); ctx.restore();
  ctx.beginPath();
  for (let i = 0; i < 60; i++) { const a = i / 60 * 6.283 - Math.PI / 2, r1 = R * (i % 5 ? .8 : .72); ctx.moveTo(Math.cos(a) * R * .85, Math.sin(a) * R * .85); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); }
  glowStroke(3, 1.2, G, GH);
  // clock hands running backwards
  [[-t * 3, .72, 2.4], [-t * .25, .5, 3.4], [-t * 9, .78, 1]].forEach(([a, len, w]) => {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R * len, Math.sin(a) * R * len); glowStroke(w * 3, w, G, GH);
  });
  // the eye
  const w = R * .6, h = R * .3 * e;
  ctx.beginPath(); ctx.moveTo(-w, 0); ctx.quadraticCurveTo(0, -h * 2, w, 0); ctx.quadraticCurveTo(0, h * 2, -w, 0); ctx.closePath();
  ctx.fillStyle = 'rgba(4,22,12,.75)'; ctx.fill(); glowStroke(8, 2.2, G, GH);
  glow(0, 0, R * .2, G, .95); circle(R * .13 * e); glowStroke(5, 1.6, G, GH);
  glow(0, 0, R * .06, GH, 1);
  ctx.restore();
}

let last = performance.now(), frames = 0, fpsT = last, detT = last;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  const t = now / 1000; frames++;
  if (now - fpsT >= 500) {
    fpsEl.textContent = `${Math.round(frames / ((now - fpsT) / 1000))} fps · ตรวจจับ ${Math.round(detectCount / ((now - detT) / 1000))}`;
    frames = 0; fpsT = now; detectCount = 0; detT = now;
  }
  ctx.clearRect(0, 0, W, H);
  const kPos = 1 - Math.exp(-dt * 28), kSize = 1 - Math.exp(-dt * 18);
  let anyOpen = false, anyHand = false;

  for (const s of slots) {
    const visible = now - s.seen < 250, fist = visible && now - s.lastFist < 150;
    if (visible) anyHand = true; if (fist) anyOpen = true;
    s.x += (s.tx - s.x) * kPos; s.y += (s.ty - s.y) * kPos; s.size += (s.tsize - s.size) * kSize;
    s.open += ((fist ? 1 : 0) - s.open) * (1 - Math.exp(-dt * (fist ? 12 : 20)));
    if (s.open < .005) s.open = 0;
    if (s.open > .3) { s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 26) s.trail.shift(); } else if (s.trail.length) s.trail.shift();
    const e = ease(s.open); if (!e) continue;
    ctx.globalCompositeOperation = 'lighter';
    if (sel === 0) { const R = s.size * 2.4 * e; drawWeapons(s, t, R, e); drawMandala(s, t, R, e); ringSparks(s, R, Math.round(5 * e)); }
    else if (sel === 1) { const R = s.size * 3.4 * e; drawPortal(s, t, e, R); ringSparks(s, R * 1.02, Math.round(12 * e)); }
    else if (sel === 2) { drawMirror(s, t, e); }
    else { const R = s.size * 2.8 * e; drawTime(s, t, R, e); timeSparks(s, R, Math.round(5 * e)); }
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const kept = [];
  for (const p of sparks) {
    p.px = p.x; p.py = p.y; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= .985; p.life -= p.decay;
    if (p.life <= 0) continue;
    ctx.strokeStyle = p.g ? `rgba(110,255,${150 + (p.life * 80) | 0},${p.life})` : `rgba(255,${170 + (p.life * 70) | 0},70,${p.life})`;
    ctx.lineWidth = 1 + p.life * 1.6;
    ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke(); kept.push(p);
  }
  sparks = kept; ctx.globalCompositeOperation = 'source-over';

  statusEl.textContent = anyOpen ? POW[sel].n : anyHand ? `เลือก: ${POW[sel].n} · กำมือเพื่อร่าย` : 'ยื่นมือเข้ามาในกล้อง';
  requestAnimationFrame(frame);
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'กำลังโหลด...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 60 } }, audio: false
    });
    video.srcObject = stream; await video.play();
    document.getElementById('start').remove();
    requestAnimationFrame(frame);
    let busy = false;
    const loop = async () => {
      if (!busy && video.readyState >= 2) { busy = true; try { await handsModel.send({ image: video }); } catch (e) { console.error(e); } busy = false; }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'เปิดกล้อง';
    alert('เปิดกล้องไม่ได้: ต้องอนุญาตกล้อง และเปิดผ่าน https หรือ localhost');
  }
};
</script>
</body>
</html>
